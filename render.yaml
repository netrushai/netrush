# Render Blueprint: Dashboard → New → Blueprint → pick this repo. See DEPLOY.md.
services:
  - type: web
    name: netrush
    runtime: python
    plan: free                  # demo. Use "starter" + the disk below to keep data between restarts.
    buildCommand: echo "No dependencies - standard library only"
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DEMO_MODE
        value: "1"              # demo phone, web door keypad, on-screen login codes
      - key: TRUST_PROXY
        value: "1"              # Render sits in front: read the client IP from X-Forwarded-For
      - key: FACILITY_NAME
        value: NetRush
      - key: PUBLIC_URL
        sync: false             # fill in after the first deploy, e.g. https://netrush.onrender.com
      - key: ADMIN_PHONE
        value: "9999999999"
      - key: ADMIN_PASSWORD
        sync: false             # you choose it when creating the service
      - key: DEVICE_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
    # For a paid plan, keep the database across deploys:
    # disk:
    #   name: netrush-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add env var DB_PATH=/var/data/netrush.db
